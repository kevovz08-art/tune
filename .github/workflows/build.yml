name: Build RelapseTune VST3
on:
  push:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          $p = Get-ChildItem -Path build -Recurse -Directory -Filter "RelapseTune.vst3" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $p.FullName -Destination dist -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: RelapseTune-VST3-Windows
          path: dist
